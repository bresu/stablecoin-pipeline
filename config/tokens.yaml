settings:
  # Refuse to run against the wrong database (important after the earlier BSC/ETH DSN mix-up).
  expected_database: ethereum1

  # Keep false while the local Ethereum RPC is unavailable. The configured decimals are still
  # validated indirectly because each token address must exist in public.token.
  verify_decimals: false

  # Required for the one-time migration of old token views that do not yet contain
  # `eth_tx.success IS TRUE`. With rebuild_token_view: if_legacy, already-migrated
  # views are reused and are NOT rebuilt again.
  allow_destructive_rebuilds: true


# Rebuild modes used below:
#   false / never  -> never drop an existing view
#   true / always  -> rebuild every run (normally avoid this)
#   if_legacy      -> rebuild only once when an existing view predates the current definition
#
# Address filters supported by pipeline.py:
#   all, eoa_eoa, eoa_sc, sc_eoa, sc_sc
#
# FINAL supervisor analysis: run all five ERC-20 datasets for every enabled token:
#   all, eoa_eoa, eoa_sc, sc_eoa, sc_sc
# Each subset goes through the same complete downstream analysis.
#
# Mint/burn handling:
#   - Main activity/user/adoption/size analyses EXCLUDE every Transfer event where
#     either from or to is the Ethereum zero address.
#   - monthly_mint_burn runs once per token on the successful-transaction base view
#     and stores minting and burning separately in <token>_all_monthly_mint_burn.csv.


# Native ETH analysis. This is intentionally `all` only: no EOA/SC splitting.
# Source: eth_tx.value, i.e. top-level Ethereum transaction value only.
# Internal ETH movements from execution traces are outside the dataset.
# Contract-creation transactions (to_id IS NULL) are excluded because eth_tx does
# not store the newly created contract address as to_id.
native_eth:
  enabled: true
  symbol: ETH
  decimals: 18
  setup_view: true
  rebuild_view: if_legacy
  # Set true if eth_tx has grown after eth_native_transfers was last built/refreshed.
  refresh_view: false
  # false = literal `all` top-level transfers, including rare sends to zero address.
  exclude_zero_address: false
  analyses:
    monthly_activity: true
    monthly_summary: true
    monthly_adoption_and_funded_by: true
    monthly_top_users: true
    transfer_size_histogram_all_time: true
    monthly_transfer_size_buckets: true


