settings:
  # Hard safety check: refuse to run against the Ethereum DB by accident.
  expected_database: bsc1

  # Dedicated state schema. `reset` drops ONLY this schema, never raw scraper tables.
  analysis_schema: analysis_bsc

  # Start conservatively. 100k BSC blocks still represents a large raw chunk.
  # After the first chunks are stable, 250000 can be benchmarked.
  chunk_size_blocks: 100000
  native_chunk_size_blocks: 100000

  # Relative to bsc/pipeline.py. CSV file names/columns match the Ethereum pipeline
  # for the `all` transfer filter, so the plotting pipeline can consume them.
  output_dir: output

range:
  start_block: 1
  # Exclusive bound: includes block 116,000,000.
  end_block_exclusive: 116000001

# Native BNB is the BSC analogue of the Ethereum pipeline's native ETH source.
# It uses public.transaction.value, success=true, value>0, to_id IS NOT NULL.
# Internal BNB movements from execution traces are not included.
native_bnb:
  enabled: true
  symbol: BNB
  decimals: 18
  exclude_zero_address: false

# EOA/SC filters are intentionally deferred. All BEP-20 outputs use filter=all.
# Main behavioural analyses exclude zero-address mint/burn events exactly like
# the Ethereum pipeline; mint/burn is exported separately.
tokens:
